<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <title>rack.bar favicon</title>
  <!-- The small-size cut ("C") on a 16px grid: thicker bar, no collar detail.
       Light by default; the media query flips the ground and the bar for dark
       browsers. scripts/icons.mjs copies this file to public/favicon.svg and
       renders the dark cut into public/favicon.ico. Redraw freely, but keep the
       ground/bar classes and the dark media query so both stay automatic. -->
  <style>
    .ground { fill: #fff; }
    .bar { fill: #000; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #000; }
      .bar { fill: #fff; }
    }
  </style>
  <rect class="ground" width="16" height="16" rx="3"/>
  <rect class="bar" x="1" y="7" width="14" height="2"/>
  <rect x="4" y="1" width="3" height="14" rx=".6" fill="#EB1D25"/>
  <rect x="7.5" y="1" width="2.5" height="14" rx=".6" fill="#FAB206"/>
  <rect x="10.5" y="3.5" width="2" height="9" rx=".6" fill="#1455A9"/>
</svg>
