<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Installable web app (RBAR-71). theme-color and the manifest's colours are the
       --rack-surface token (#0d0e10), so the browser chrome and the launch screen
       match the app instead of flashing white. Icons come from assets/icons/ via
       scripts/icons.mjs (npm run icons). -->
  <meta name="theme-color" content="#0d0e10">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Home Screen launch on iOS: standalone (no Safari toolbars), titled rack.bar.
       An opaque black status bar (RBAR-98): with black-translucent the page ran under
       the status bar and iOS shaded the top of the header. Now the page starts below
       the clock; body still pads by env(safe-area-inset-top), which is then 0. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="rack.bar">
  <title>rack.bar — load the bar</title>
  <meta name="description" content="Load a barbell to a target weight. Tells you exactly which plates to put on each side.">
  <!-- Preload the self-hosted handoff typefaces (RBAR-23) so the woff2 fetch starts
       with the document, not after tokens.css parses -- avoids a flash of fallback
       text and the layout shift it would cause. crossorigin is required on font
       preloads even same-origin, or the preload is discarded and re-fetched. -->
  <link rel="preload" href="/fonts/hanken-grotesk-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jetbrains-mono-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    /* RBAR-59: two quick taps must stay two taps on iPhone, not double-tap-to-zoom.
       manipulation disables only double-tap zoom (pinch still works, so the viewport
       meta keeps user scaling). touch-action is not inherited; the browser intersects
       it across the touched element's ancestors, so setting it on the root covers
       every shadow root and the gaps between controls. */
    html { touch-action: manipulation; }
    body {
      background: var(--rack-bg);
      color: var(--rack-fg);
      font-family: var(--rack-font);
      /* RBAR-67: exactly the small viewport (toolbars showing), a ceiling not a floor --
         the app column shrinks its bar block to fit rather than growing the page.
         box-sizing (above) keeps the safe-area padding inside this height. */
      height: 100svh;
      display: flex; flex-direction: column;
      /* respect notches/home indicators on phones */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    /* No horizontal scroll at a phone width: the app is a single column. */
    body { overflow-x: hidden; }
  </style>
</head>
<body>
  <!-- The app shell (RBAR-15, ADR-0007): the header (wordmark + Setup pill), the
       calculator console, and the Setup sheet that hosts rig configuration. The shell
       owns the chosen Bar and threads it into the parameterized core (ADR-0002). -->
  <rack-app></rack-app>

  <script type="module" src="./elements/app.ts"></script>
  <!-- Works offline (RBAR-81, ADR-0018): registers /sw.js in production builds and
       shows a quiet Update button when a new version is waiting. -->
  <script type="module" src="./elements/update.ts"></script>
</body>
</html>
